<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="manifest" href="manifest.json">
    
    <title>备忘录</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, "HarmonyOS Sans", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        /* 华为顶部导航栏 */
        .hw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 40px;
            flex-shrink: 0;
        }
        
        .hw-icon {
            width: 24px;
            height: 24px;
            stroke: #333333;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .header-right {
            display: flex;
            gap: 25px;
        }

        /* 标题区域 */
        .title-section {
            padding: 10px 20px;
            flex-shrink: 0;
        }
        
        .title-text {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0 0 8px 0;
            border: none;
            outline: none;
            width: 100%;
            background: transparent;
        }
        
        .meta-text {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #999999;
            gap: 10px;
        }
        
        .meta-tag {
            background-color: #f2f2f2;
            padding: 3px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* 主输入区 */
        textarea {
            flex-grow: 1;
            width: 100%;
            border: none;
            padding: 15px 20px;
            font-size: 17px;
            line-height: 1.6;
            resize: none;
            outline: none;
            box-sizing: border-box;
            caret-color: #0052d9; /* 鸿蒙蓝光标 */
            margin-bottom: 50px; 
        }

        /* 华为底部工具栏 */
        .hw-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #f0f0f0;
            padding-bottom: env(safe-area-inset-bottom); 
        }

        .bottom-icon {
            width: 22px;
            height: 22px;
            stroke: #1a1a1a;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 魔术触控区 */
        #secret-reveal {
            position: fixed;
            bottom: 60px; 
            right: 0;
            width: 50vw; 
            height: 25vh; 
            z-index: 9999;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0 20px 15px 0;
            box-sizing: border-box;
            font-size: 17px; 
            color: #1a1a1a; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>

    <div class="hw-header">
        <svg class="hw-icon" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
        <div class="header-right">
            <svg class="hw-icon" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            <svg class="hw-icon" viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            <svg class="hw-icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
    </div>
