    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, "HarmonyOS Sans", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        /* 华为顶部导航栏 */
        .hw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 40px;
            flex-shrink: 0;
        }
        
        .hw-icon {
            width: 24px;
            height: 24px;
            stroke: #333333;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .header-right {
            display: flex;
            gap: 25px;
        }

        /* 标题区域 */
        .title-section {
            padding: 10px 20px;
            flex-shrink: 0;
        }
        
        .title-text {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0 0 8px 0;
            border: none;
            outline: none;
            width: 100%;
            background: transparent;
        }
        
        .meta-text {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #999999;
            gap: 10px;
        }
        
        .meta-tag {
            background-color: #f2f2f2;
            padding: 3px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* 主输入区 */
        textarea {
            flex-grow: 1;
            width: 100%;
            border: none;
            padding: 15px 20px;
            font-size: 17px;
            line-height: 1.6;
            resize: none;
            outline: none;
            box-sizing: border-box;
            caret-color: #0052d9; /* 鸿蒙蓝光标 */
            margin-bottom: 50px; 
        }

        /* 华为底部工具栏 */
        .hw-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #f0f0f0;
            padding-bottom: env(safe-area-inset-bottom); 
        }

        .bottom-icon {
            width: 22px;
            height: 22px;
            stroke: #1a1a1a;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 魔术触控区 */
        #secret-reveal {
            position: fixed;
            bottom: 60px; 
            right: 0;
            width: 50vw; 
            height: 25vh; 
            z-index: 9999;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0 20px 15px 0;
            box-sizing: border-box;
            font-size: 17px; 
            color: #1a1a1a; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        const combinedString = extraLifeWords + " " + wordString;
        const dictionary = [...new Set(combinedString.split(" "))].filter(w => w.length > 0);

        const textarea = document.getElementById('chaosInput');
        const revealDiv = document.getElementById('secret-reveal');

        function calculateWord() {
            const chaoticInput = textarea.value;
            const cleanInput = chaoticInput.toLowerCase().replace(/[^a-z\n]/g, '');
            const lines = cleanInput.trim().split('\n').filter(line => line.trim() !== '');
            const targetLength = lines.length;
            
            if (targetLength === 0) return "";

            let possibleWords = [];
            
            for (let i = 0; i < dictionary.length; i++) {
                let word = dictionary[i];
                if (word.length === targetLength) {
                    let isMatch = true;
                    for (let j = 0; j < targetLength; j++) {
                        if (!lines[j].includes(word[j])) {
                            isMatch = false;
                            break;
                        }
                    }
                    if (isMatch && !possibleWords.includes(word)) {
                        possibleWords.push(word);
                    }
                }
            }
            
            if (possibleWords.length > 0) {
                return possibleWords.join(", ");
            } else {
                return "Something"; 
            }
        }

        function formatOutput(str) {
            return str.split(', ').map(word => {
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(', ');
        }
        
        let lastTap = 0;
        let isRevealed = false; 
        let isTouchDevice = false; 

        function toggleReveal() {
            if (isRevealed) {
                revealDiv.innerText = ""; 
                isRevealed = false;
            } else {
                revealDiv.innerText = formatOutput(calculateWord()); 
                isRevealed = true;
            }
        }

        revealDiv.addEventListener('touchstart', function(e) {
            isTouchDevice = true; 
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            
            if (tapLength < 500 && tapLength > 0) {
                e.preventDefault(); 
                toggleReveal();
                lastTap = 0; 
            } else {
                lastTap = currentTime;
            }
        }, { passive: false });

        revealDiv.addEventListener('mousedown', function(e) {
            if (isTouchDevice) return; 
            
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            
            if (tapLength < 500 && tapLength > 0) {
                e.preventDefault();
                toggleReveal();
                lastTap = 0; 
            } else {
                lastTap = currentTime;
            }
        });

    </script>
